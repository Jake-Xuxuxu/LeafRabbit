<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8f7f3">
<title>拾页 · 私人日记</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;500;600;700&display=swap');
:root{--paper:#f8f7f3;--white:#fffefa;--ink:#28352e;--muted:#899087;--line:#e9e8df;--green:#597864;--green2:#e7eee8;--gold:#b68d56;--shadow:0 12px 40px #3944340b;--serif:'Noto Serif SC',serif;--sans:'DM Sans','Noto Sans SC',sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px var(--sans);min-height:100vh}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}.app{max-width:1360px;min-height:100vh;margin:auto;display:grid;grid-template-columns:248px minmax(0,1fr)}aside{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);padding:34px 22px;display:flex;flex-direction:column;background:#f8f7f3}.brand{display:flex;align-items:center;gap:12px;margin:2px 7px 43px}.brand-icon{width:37px;height:37px;border-radius:12px;background:var(--green);display:grid;place-items:center;color:white;font:20px var(--serif);box-shadow:0 5px 14px #59786436}.brand-name{font:600 21px var(--serif);letter-spacing:1px}.brand-sub{font-size:10px;color:var(--muted);letter-spacing:1.4px;margin-top:2px}.nav-label{font-size:10px;color:#a3a59b;letter-spacing:1.7px;margin:0 10px 11px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;text-align:left;border-radius:10px;padding:11px 12px;color:#70796f;display:flex;align-items:center;gap:12px;transition:.2s}.nav button:hover{background:#efeee8}.nav button.active{background:var(--green2);color:var(--green);font-weight:600}.nav .ico{width:18px;text-align:center;font-size:16px}.nav-count{margin-left:auto;font-size:11px;color:#a1a79d}.side-bottom{margin-top:auto}.quote{border-top:1px solid var(--line);padding:21px 9px 0;color:#8d9187;font:12px/1.9 var(--serif)}.quote span{display:block;color:#b0a58e;font-size:11px;margin-top:7px}.side-meta{font-size:10px;color:#afb1a7;padding:16px 9px 0;letter-spacing:.4px}
main{padding:0 5.4%;max-width:1140px;width:100%;margin:0 auto}.topbar{height:81px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.breadcrumb{color:#92968c;font-size:12px}.breadcrumb b{color:var(--ink);font-weight:500}.top-actions{display:flex;align-items:center;gap:12px}.today-chip{font-size:11px;color:#858b80;padding:7px 11px;border:1px solid var(--line);border-radius:20px}.icon-btn{border:1px solid var(--line);background:var(--white);width:35px;height:35px;border-radius:50%;font-size:15px;color:#737d72}.content{padding:45px 0 70px}.welcome{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:29px}.eyebrow{font-size:10px;letter-spacing:2px;color:var(--gold);text-transform:uppercase;margin-bottom:11px}.welcome h1{font:500 32px var(--serif);margin:0;letter-spacing:1px}.welcome p{color:#8f9489;margin:10px 0 0;font:13px var(--serif)}.new-btn{border:0;border-radius:9px;background:var(--green);color:white;padding:12px 18px;box-shadow:0 5px 14px #5978642c;font-size:13px;transition:.2s}.new-btn:hover{transform:translateY(-1px);background:#486b54}.new-btn span{font-size:16px;margin-right:7px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin:26px 0 28px}.stat{padding:17px 19px;border:1px solid var(--line);background:#fbfaf7;border-radius:11px}.stat small{color:#9a9d92;font-size:11px}.stat strong{display:block;margin-top:7px;font:500 23px var(--serif);color:#465e4c}.stat em{font:11px var(--sans);color:#9ba096;margin-left:5px}.section-head{display:flex;align-items:center;justify-content:space-between;margin:29px 0 14px}.section-head h2{font:500 17px var(--serif);margin:0}.section-head h2 span{color:#a0a397;font:11px var(--sans);margin-left:9px}.filters{display:flex;gap:9px;align-items:center}.search{position:relative}.search input{width:178px;border:1px solid var(--line);border-radius:8px;background:var(--white);padding:9px 12px 9px 31px;outline:none;font-size:11px}.search:before{content:'⌕';position:absolute;left:11px;top:4px;font-size:19px;color:#92988d}.filters select{border:1px solid var(--line);border-radius:8px;background:var(--white);padding:9px 11px;font-size:11px;color:#778074;outline:none}.entry-list{display:grid;gap:11px}.entry{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:19px 21px;display:grid;grid-template-columns:53px 1fr auto;gap:16px;align-items:start;transition:.2s;cursor:pointer}.entry:hover{box-shadow:var(--shadow);border-color:#d9ddd3;transform:translateY(-1px)}.entry-date{border-right:1px solid var(--line);padding-right:13px;text-align:center}.entry-date b{display:block;font:500 23px var(--serif);color:#597864}.entry-date span{font-size:10px;color:#a1a397;letter-spacing:1px}.entry-main h3{font:500 15px var(--serif);margin:1px 0 7px}.entry-main p{font:12px/1.8 var(--serif);color:#888d83;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.entry-foot{display:flex;gap:9px;align-items:center;margin-top:11px}.tag{background:#f0f1eb;color:#84907f;border-radius:20px;padding:4px 9px;font-size:10px}.entry-mood{color:#b29a72;font-size:11px}.entry-time{color:#adb0a5;font-size:10px;white-space:nowrap}.empty{padding:53px 20px;text-align:center;color:#a1a397;background:#fbfaf7;border:1px dashed #ddded4;border-radius:12px}.empty b{display:block;font:18px var(--serif);color:#6e7c6e;margin-bottom:9px}.empty button{margin-top:17px;border:0;background:var(--green2);color:var(--green);padding:9px 14px;border-radius:7px}.privacy{font-size:10px;color:#a5a79e;margin:17px 2px;display:flex;gap:7px;align-items:center}
.overlay{position:fixed;inset:0;background:#25342ba6;display:none;align-items:center;justify-content:center;padding:20px;z-index:3;backdrop-filter:blur(3px)}.overlay.show{display:flex}.editor{width:min(660px,100%);max-height:92vh;overflow:auto;background:var(--white);border-radius:16px;padding:30px 34px;box-shadow:0 25px 80px #18271d44}.editor-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.editor-head h2{font:500 20px var(--serif);margin:0}.close{border:0;background:#f1f1eb;width:30px;height:30px;border-radius:50%;color:#7e857a;font-size:17px}.editor label{display:block;color:#858c80;font-size:11px;margin:15px 0 7px}.editor input,.editor textarea,.editor select{width:100%;border:1px solid var(--line);border-radius:8px;background:#fffefa;padding:11px 12px;outline:none}.editor input:focus,.editor textarea:focus{border-color:#99ad9d;box-shadow:0 0 0 3px #e7eee8}.editor input.title{font:18px var(--serif)}.editor textarea{height:190px;resize:vertical;font:13px/1.9 var(--serif)}.editor-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.editor-actions{display:flex;justify-content:space-between;align-items:center;margin-top:22px}.delete-btn{border:0;background:transparent;color:#b98275;font-size:12px}.save-btn{border:0;background:var(--green);color:white;border-radius:8px;padding:11px 21px}.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,15px);background:#33483a;color:#fff;padding:10px 17px;border-radius:24px;font-size:12px;opacity:0;transition:.25s;pointer-events:none;z-index:5}.toast.show{opacity:1;transform:translate(-50%,0)}
body.dark{--paper:#202820;--white:#283329;--ink:#e4e9df;--muted:#9aa696;--line:#3b463b;--green:#8eae92;--green2:#344439;--gold:#d4b57f;--shadow:0 12px 40px #0003}body.dark .stat,body.dark .empty{background:#252e25}body.dark .nav button:hover{background:#303930}body.dark .editor input,body.dark .editor textarea,body.dark .editor select,body.dark .search input,body.dark .filters select{background:#283329;color:#e4e9df}
@media(max-width:760px){.app{display:block}aside{position:fixed;z-index:2;top:auto;bottom:0;left:0;right:0;width:100%;height:67px;padding:5px 10px;background:#faf9f5f2;border:0;border-top:1px solid var(--line);backdrop-filter:blur(12px)}.brand,.nav-label,.quote,.side-meta{display:none}.nav{height:100%;display:flex;justify-content:space-around;align-items:center;gap:0}.nav button{font-size:0;display:grid;justify-items:center;gap:1px;padding:7px 12px;min-width:57px}.nav .ico{font-size:18px}.nav-count{display:none}main{padding:0 20px}.topbar{height:62px}.content{padding:32px 0 100px}.welcome h1{font-size:26px}.welcome p{font-size:11px}.new-btn{padding:10px 12px;font-size:11px}.stats{gap:8px}.stat{padding:12px}.stat strong{font-size:19px}.stat small{font-size:10px}.section-head{align-items:flex-start;gap:12px;flex-direction:column}.filters{width:100%}.search{flex:1}.search input{width:100%}.entry{grid-template-columns:42px 1fr;gap:12px;padding:15px}.entry-date{padding-right:9px}.entry-date b{font-size:20px}.entry-time{display:none}.editor{padding:23px 20px}.editor textarea{height:170px}}
</style>
</head>
<body><div class="app"><aside><div class="brand"><div class="brand-icon">页</div><div><div class="brand-name">拾页</div><div class="brand-sub">A QUIET PLACE FOR YOU</div></div></div><div class="nav-label">你的空间</div><nav class="nav"><button class="active" data-view="all"><span class="ico">▦</span>全部日记 <span class="nav-count" id="countAll">0</span></button><button data-view="month"><span class="ico">◷</span>本月回顾</button><button data-view="favorites"><span class="ico">♡</span>收藏</button></nav><div class="side-bottom"><div class="quote">“日子很长，要把寻常的日子过得有趣。”<span>— 汪曾祺</span></div><div class="side-meta">只属于你的安静角落 · 内容保存在本机</div></div></aside><main><header class="topbar"><div class="breadcrumb">拾页　/　<b id="crumb">全部日记</b></div><div class="top-actions"><span class="today-chip" id="today"></span><button class="icon-btn" id="themeBtn" title="切换主题">☼</button><button class="icon-btn" id="exportBtn" title="导出备份">↓</button><button class="icon-btn" id="importBtn" title="导入备份">↑</button><input type="file" id="importFile" accept="application/json" hidden></div></header><section class="content"><div class="welcome"><div><div class="eyebrow">YOUR PERSONAL JOURNAL</div><h1 id="greeting">给今天，留一页。</h1><p>把心情写下来，时间会替你妥善收藏。</p></div><button class="new-btn" id="newBtn"><span>＋</span>写一篇日记</button></div><div class="stats"><div class="stat"><small>累计记录</small><strong id="statTotal">0<em>篇日记</em></strong></div><div class="stat"><small>连续记录</small><strong id="statStreak">0<em>天</em></strong></div><div class="stat"><small>写下的文字</small><strong id="statWords">0<em>字</em></strong></div></div><div class="section-head"><h2>最近的日子 <span id="listCount">0 篇</span></h2><div class="filters"><div class="search"><input id="search" placeholder="搜索日记…" aria-label="搜索日记"></div><select id="monthFilter" aria-label="按月份筛选"><option value="">所有月份</option></select></div></div><div class="entry-list" id="entries"></div><div class="privacy">♧　你的日记只存在当前浏览器中，不会上传到网站或 GitHub。记得定期导出备份。</div></section></main></div>
<div class="overlay" id="overlay"><section class="editor"><div class="editor-head"><h2 id="editorTitle">写下这一刻</h2><button class="close" id="closeBtn">×</button></div><label for="entryTitle">给今天一个标题</label><input class="title" id="entryTitle" maxlength="60" placeholder="此刻，你在想什么？"><label for="entryBody">日记内容</label><textarea id="entryBody" placeholder="慢慢写，不必着急……"></textarea><div class="editor-row"><div><label for="entryMood">今天的心情</label><select id="entryMood"><option>😊 开心</option><option>🌿 平静</option><option>✨ 期待</option><option>🌧️ 低落</option><option>🌙 疲惫</option><option>💛 感恩</option><option>🔥 充实</option></select></div><div><label for="entryTag">分类标签</label><input id="entryTag" maxlength="16" placeholder="例如：生活、旅行"></div></div><div class="editor-actions"><button class="delete-btn" id="deleteBtn">删除这篇日记</button><button class="save-btn" id="saveBtn">保存日记</button></div></section></div><div class="toast" id="toast"></div>
<script>
(()=>{'use strict';const KEY='shipage-journal-v1';let entries=[],editing=null,view='all';const $=s=>document.querySelector(s),today=new Date();const fmtDate=d=>new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(d);const dateKey=d=>{let x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`};$('#today').textContent=fmtDate(today);function load(){try{entries=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(entries))entries=[]}catch{entries=[]}}function store(){localStorage.setItem(KEY,JSON.stringify(entries));render()}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(s){let t=$('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}function calcStreak(){let dates=new Set(entries.map(e=>e.date)),d=new Date();if(!dates.has(dateKey(d)))d.setDate(d.getDate()-1);let n=0;while(dates.has(dateKey(d))){n++;d.setDate(d.getDate()-1)}return n}function render(){let all=[...entries].sort((a,b)=>b.date.localeCompare(a.date)||b.updated-a.updated);$('#countAll').textContent=entries.length;$('#statTotal').innerHTML=`${entries.length}<em>篇日记</em>`;$('#statWords').innerHTML=`${entries.reduce((n,e)=>n+[...e.body].length,0)}<em>字</em>`;$('#statStreak').innerHTML=`${calcStreak()}<em>天</em>`;let months=[...new Set(entries.map(e=>e.date.slice(0,7)))].sort().reverse(),sel=$('#monthFilter').value;$('#monthFilter').innerHTML='<option value="">所有月份</option>'+months.map(m=>`<option value="${m}">${m.replace('-',' 年 ')} 月</option>`).join('');$('#monthFilter').value=sel;let q=$('#search').value.trim().toLowerCase();let filtered=all.filter(e=>{let ok=view==='favorites'?e.favorite:view==='month'?e.date.startsWith(dateKey(today).slice(0,7)):true;return ok&&(!sel||e.date.startsWith(sel))&&(!q||`${e.title} ${e.body} ${e.tag}`.toLowerCase().includes(q))});$('#listCount').textContent=`${filtered.length} 篇`;$('#entries').innerHTML=filtered.length?filtered.map(e=>{let d=new Date(e.date+'T00:00:00');return `<article class="entry" data-id="${e.id}"><div class="entry-date"><b>${d.getDate()}</b><span>${String(d.getMonth()+1).padStart(2,'0')}月</span></div><div class="entry-main"><h3>${esc(e.title||'未命名日记')} ${e.favorite?'　<span style="color:#c3a772">♥</span>':''}</h3><p>${esc(e.body||'（没有正文）')}</p><div class="entry-foot">${e.tag?`<span class="tag">${esc(e.tag)}</span>`:''}<span class="entry-mood">${esc(e.mood)}</span></div></div><span class="entry-time">${e.date}</span></article>`}).join(''):`<div class="empty"><b>${q?'没有找到相关日记':'这页还空着'}</b>${q?'换个关键词试试。':'写下第一篇，给今天留一点痕迹。'}${!q?'<button id="emptyNew">开始记录</button>':''}</div>`;document.querySelectorAll('.entry').forEach(el=>el.addEventListener('click',()=>openEditor(el.dataset.id)));$('#emptyNew')?.addEventListener('click',()=>openEditor())}function openEditor(id){editing=id||null;let e=entries.find(x=>x.id===id);$('#editorTitle').textContent=e?'修改日记':'写下这一刻';$('#entryTitle').value=e?.title||'';$('#entryBody').value=e?.body||'';$('#entryMood').value=e?.mood||'😊 开心';$('#entryTag').value=e?.tag||'';$('#deleteBtn').style.visibility=e?'visible':'hidden';$('#overlay').classList.add('show');$('#entryTitle').focus()}function closeEditor(){$('#overlay').classList.remove('show')}$('#newBtn').onclick=()=>openEditor();$('#closeBtn').onclick=closeEditor;$('#overlay').addEventListener('click',e=>{if(e.target===$('#overlay'))closeEditor()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeEditor();if((e.ctrlKey||e.metaKey)&&e.key==='Enter'&&$('#overlay').classList.contains('show'))$('#saveBtn').click()});$('#saveBtn').onclick=()=>{let title=$('#entryTitle').value.trim(),body=$('#entryBody').value.trim();if(!title&&!body){toast('先写点内容再保存吧');return}let old=entries.find(x=>x.id===editing);let item={id:editing||crypto.randomUUID(),title,body,mood:$('#entryMood').value,tag:$('#entryTag').value.trim(),date:old?.date||dateKey(today),updated:Date.now(),favorite:old?.favorite||false};if(old)entries=entries.map(x=>x.id===editing?item:x);else entries.push(item);store();closeEditor();toast('已妥善收藏 ✦')};$('#deleteBtn').onclick=()=>{if(editing&&confirm('确定删除这篇日记吗？')){entries=entries.filter(e=>e.id!==editing);store();closeEditor();toast('日记已删除')}};$('#search').addEventListener('input',render);$('#monthFilter').addEventListener('change',render);document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');view=b.dataset.view;$('#crumb').textContent={all:'全部日记',month:'本月回顾',favorites:'收藏'}[view];render()}));$('#entries').addEventListener('contextmenu',e=>{let card=e.target.closest('.entry');if(!card)return;e.preventDefault();let item=entries.find(x=>x.id===card.dataset.id);if(item){item.favorite=!item.favorite;store();toast(item.favorite?'已加入收藏':'已取消收藏')}});$('#themeBtn').onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('shipage-dark',document.body.classList.contains('dark'))};if(localStorage.getItem('shipage-dark')==='true')document.body.classList.add('dark');$('#exportBtn').onclick=()=>{let blob=new Blob([JSON.stringify(entries,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`拾页日记备份-${dateKey(today)}.json`;a.click();URL.revokeObjectURL(a.href);toast('备份已下载')};$('#importBtn').onclick=()=>$('#importFile').click();$('#importFile').onchange=async e=>{try{let data=JSON.parse(await e.target.files[0].text());if(!Array.isArray(data)||!data.every(x=>x.date&&typeof x.body==='string'))throw Error();if(confirm(`发现 ${data.length} 篇日记。导入后将与当前内容合并，同日期同 ID 的日记会更新。继续吗？`)){let map=new Map(entries.map(x=>[x.id,x]));data.forEach(x=>map.set(x.id||crypto.randomUUID(),x));entries=[...map.values()];store();toast('备份已导入')}}catch{toast('文件格式不正确')}e.target.value=''};render()})();
</script></body></html>
